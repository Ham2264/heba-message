<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎀 مفاجأة لإسراء 🎀</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(180deg,#ffd6f6,#ffeefe,#f7d8ff);
overflow:hidden;
height:100vh;
color:#ff4f9d;
}

/* الخلفية */
.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
overflow:hidden;
z-index:-1;
}

/* العناصر الطايرة */
.float{
position:absolute;
animation:floatUp linear infinite;
opacity:.9;
filter:drop-shadow(0 0 10px rgba(255,255,255,.6));
}

@keyframes floatUp{
0%{
transform:translateY(100vh) scale(.6) rotate(0deg);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-20vh) scale(1.2) rotate(360deg);
opacity:0;
}
}

/* الصفحات */
.screen{
display:none;
height:100vh;
padding:30px 20px;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
animation:fade .7s;
}

.active{
display:flex;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* الكروت */
.card,.final-box{
background:rgba(255,255,255,.30);
backdrop-filter:blur(12px);
padding:28px;
border-radius:35px;
width:100%;
max-width:360px;
box-shadow:0 0 30px rgba(255,255,255,.4);
border:2px solid rgba(255,255,255,.35);
animation:floatCard 3s ease-in-out infinite;
}

@keyframes floatCard{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-7px);
}
}

/* العنوان */
.title{
font-size:32px;
margin-bottom:10px;
color:#ff2f92;
text-shadow:0 0 12px rgba(255,255,255,.9);
}

/* النص */
.desc{
font-size:16px;
line-height:2;
color:#c93d86;
font-weight:bold;
}

/* اسمها */
.name{
font-size:22px;
margin-bottom:10px;
color:#ff2f92;
font-weight:bold;
}

/* الأزرار */
.btn{
margin-top:18px;
border:none;
padding:14px 22px;
border-radius:999px;
background:#ff69b4;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 18px rgba(255,105,180,.5);
}

.btn:hover{
transform:scale(1.08);
background:#ff3c9d;
}

/* الخيارات */
.option{
width:100%;
margin-top:12px;
padding:14px;
border-radius:20px;
border:none;
background:rgba(255,255,255,.65);
color:#3b2232;
font-size:15px;
cursor:pointer;
transition:.25s;
font-weight:bold;
box-shadow:0 0 10px rgba(255,255,255,.3);
}

.option:hover{
transform:scale(1.04);
background:white;
color:#ff2f92;
box-shadow:0 0 18px rgba(255,255,255,.5);
}

/* صورة إسراء */
.anime{
width:130px;
height:130px;
object-fit:cover;
border-radius:50%;
margin-bottom:15px;
box-shadow:
0 0 25px rgba(255,255,255,.8),
0 0 45px rgba(255,182,220,.7);
border:4px solid rgba(255,255,255,.85);
animation:bounce 2.5s infinite;
transition:.4s;
}

.anime:hover{
transform:scale(1.05);
}

@keyframes bounce{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
}

/* الرسالة */
#message{
line-height:2.3;
font-size:16px;
white-space:pre-line;
color:#2a2a2a;
font-weight:bold;
text-shadow:none;
}

/* glow */
.glow{
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 10px #fff;
}
to{
text-shadow:0 0 25px #ff7edb;
}
}

</style>
</head>
<body>

<div class="bg" id="bg"></div>

<!-- البداية -->
<section class="screen active" id="start">

<div class="card">

<img class="anime"
src="Screenshot_20260526-212424.png">

<div class="name">إسراء 🎀</div>

<h1 class="title glow">
مفاجأة عيد صغيرة
</h1>

<p class="desc">
قبل لا يبدأ العيد...
في شيء بسيط جدًا
بس طالع من القلب 🤍
</p>

<button class="btn" onclick="nextScreen('q1')">
🎁 افتحي المفاجأة
</button>

</div>

</section>

<!-- سؤال 1 -->
<section class="screen" id="q1">

<div class="card">

<img class="anime"
src="Screenshot_20260526-212424.png">

<h2 class="title">
لو العيد كان شعور؟
</h2>

<button class="option" onclick="nextScreen('q2')">
راحة وهدوء 🌸
</button>

<button class="option" onclick="nextScreen('q2')">
ضحك وفرحة ✨
</button>

<button class="option" onclick="nextScreen('q2')">
ناس قريبة 🎀
</button>

</div>

</section>

<!-- سؤال 2 -->
<section class="screen" id="q2">

<div class="card">

<img class="anime"
src="Screenshot_20260526-212424.png">

<h2 class="title">
وش أكثر شي يسعدك
